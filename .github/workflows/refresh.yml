name: Refresh the activity card

on:
  schedule:
    - cron: "17 5 * * *" # once a day, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Draw the pictures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 build.py
      - name: Commit if something changed
        run: |
          if git diff --quiet -- assets; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Refresh the activity card"
          git push
