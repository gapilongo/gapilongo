<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Ahmed Ghazouani. I build AI that works the security alert queue, and shows its evidence.">
<title>Ahmed Ghazouani. I build AI that works the security alert queue, and shows its evidence.</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e8edf3}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.08em}
.muted{fill:#8793a2}
@keyframes flow{0%{transform:translateX(0);opacity:0}7%{opacity:1}86%{opacity:1}100%{transform:translateX(594px);opacity:0}}
@keyframes hot{0%{transform:translateX(0);opacity:0}5%{opacity:1}88%{transform:translateX(864px);opacity:1}100%{transform:translateX(864px);opacity:1}}
@keyframes ping{0%,86%{transform:scale(1);opacity:0}88%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.d{animation:flow 7.0s linear infinite}
.h{animation:hot 8.4s linear infinite}
.ping{transform-origin:920px 288px;animation:ping 8.4s linear infinite}
@media (prefers-reduced-motion:reduce){.d,.h,.ping{animation:none}.ping{opacity:0}}
</style>
